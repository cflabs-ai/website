# cflabs.ai — Astro static site. Deployed 2026-09-22.
# Docroot: /var/www/cflabs.ai   Cert: acme.sh -> /etc/nginx/certs/cflabs.ai/
#
# Cache policy lives in this map rather than in per-location add_header, because
# an add_header inside a location REPLACES every inherited add_header — which
# would silently drop the security headers below on those paths.
map $uri $cflabs_cache {
    default                          "no-cache";                          # HTML: always revalidate (cheap, ETag)
    "~^/_astro/"                     "public, max-age=31536000, immutable"; # content-hashed build assets
    "~^/img/"                        "public, max-age=2592000";
    "~^/(robots\.txt|sitemap)"       "public, max-age=3600";
}

server {
    listen 80;
    listen [::]:80;
    server_name cflabs.ai www.cflabs.ai;
    root /var/www/cflabs.ai;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/cflabs.ai;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / { return 301 https://cflabs.ai$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.cflabs.ai;

    ssl_certificate     /etc/nginx/certs/cflabs.ai/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/cflabs.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL_cflabs:10m;

    return 301 https://cflabs.ai$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cflabs.ai;

    root /var/www/cflabs.ai;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/nginx/certs/cflabs.ai/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/cflabs.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL_cflabs:10m;

    add_header Cache-Control            $cflabs_cache always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # ---- legacy paths -> new structure -----------------------------------
    location = /product-and-solution/ { return 301 https://cflabs.ai/zk-acceleration/; }
    location = /product-and-solution  { return 301 https://cflabs.ai/zk-acceleration/; }
    location = /heritage/             { return 301 https://cflabs.ai/zk-acceleration/; }
    location = /heritage              { return 301 https://cflabs.ai/zk-acceleration/; }
    location = /wp-sitemap.xml        { return 301 https://cflabs.ai/sitemap-index.xml; }
    location ^~ /wp-admin/            { return 410; }
    location ^~ /wp-content/          { return 410; }
    location ^~ /wp-includes/         { return 410; }
    location ^~ /wp-json/             { return 410; }
    location = /wp-login.php          { return 410; }
    location = /xmlrpc.php            { return 410; }
    location = /comments/feed/        { return 410; }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
